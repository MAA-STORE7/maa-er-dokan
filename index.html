<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Finance & Udhar Tracker</title>

  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 20px auto; padding: 20px; background-color: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2, h3 { color: #333; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea, button { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    
    button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #218838; }
    
    .btn-pdf { background-color: #007bff; }
    .btn-pdf:hover { background-color: #0056b3; }

    /* SIRF UDHAR SELECTION PAR HI DIKHEGA */
    #personGroup { display: none; background: #eff6ff; padding: 12px; border-radius: 6px; border: 2px solid #3b82f6; }
    
    /* PDF Layout Styling */
    #pdfContent { background: white; padding: 20px; border: 1px solid #eee; display: none; }
    .summary-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .summary-table th, .summary-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .summary-table th { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <!-- Daily Entry Form -->
  <div class="card">
    <h2>Daily Entry Form</h2>
    <form id="trackerForm">
      <div class="form-group">
        <label for="date">Tarikh (Date):</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label for="type">Entry Type:</label>
        <select id="type" required>
          <option value="sell">Sell (Bikri)</option>
          <option value="purchase">Purchase (Kharidari)</option>
          <option value="expense">Expense (Kharcha)</option>
          <option value="debt">Debt Given (Udhar Diya)</option>
          <option value="debt_repayment">Debt Received (Udhar Wapas Mila / Minus)</option>
        </select>
      </div>

      <!-- Person Name Field -->
      <div class="form-group" id="personGroup">
        <label for="person_name" style="color: #1e40af;">Person Name (Kisko Udhar Diya / Kisse Mila):</label>
        <input type="text" id="person_name" placeholder="E.g. Rahul, Ramesh">
      </div>

      <div class="form-group">
        <label for="amount">Amount (₹):</label>
        <input type="number" step="0.01" id="amount" placeholder="Kitna rupya" required>
      </div>

      <div class="form-group">
        <label for="description">Note / Detail:</label>
        <textarea id="description" rows="2" placeholder="Koi detail (Optional)"></textarea>
      </div>

      <button type="submit" id="saveBtn">Save Entry</button>
    </form>
  </div>

  <!-- Monthly PDF Report Section -->
  <div class="card">
    <h3>Monthly PDF Report Download</h3>
    <div class="form-group">
      <label for="reportMonth">Select Month & Year:</label>
      <input type="month" id="reportMonth">
    </div>
    <button type="button" class="btn-pdf" onclick="generatePDF()">Download Monthly PDF Report</button>
  </div>

  <!-- PDF Layout Structure -->
  <div id="pdfContent">
    <h2 style="text-align: center; margin-bottom: 2px;">Monthly Financial Report</h2>
    <p style="text-align: center; color: #555; margin-top: 0;" id="pdfMonthLabel"></p>
    <hr>
    
    <h3>Monthly Summary</h3>
    <table class="summary-table">
      <tr><th>Category</th><th>Total Amount (₹)</th></tr>
      <tr><td>Total Sales</td><td id="pdfSales">0.00</td></tr>
      <tr><td>Total Purchases</td><td id="pdfPurchase">0.00</td></tr>
      <tr><td>Total Expenses</td><td id="pdfExpense">0.00</td></tr>
    </table>

    <h3 style="margin-top: 25px;">Customer Udhar Ledger (Net Outstanding)</h3>
    <table class="summary-table">
      <thead>
        <tr>
          <th>Customer Name</th>
          <th>Total Udhar Given (₹)</th>
          <th>Total Received (₹)</th>
          <th>Net Remaining (₹)</th>
        </tr>
      </thead>
      <tbody id="pdfDebtRows"></tbody>
    </table>
  </div>

  <!-- CDN Libraries Sabse Pehle Load Hongi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- app.js CDN ke baad load hoga -->
  <script src="app.js"></script>

  <!-- Main Application Logic -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('date').valueAsDate = new Date();
      
      const now = new Date();
      document.getElementById('reportMonth').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      
      updateFieldVisibility();
    });

    const typeSelect = document.getElementById('type');
    const personGroup = document.getElementById('personGroup');
    const personInput = document.getElementById('person_name');

    function updateFieldVisibility() {
      const selectedType = typeSelect.value;
      if (selectedType === 'debt' || selectedType === 'debt_repayment') {
        personGroup.style.display = 'block';
        personInput.required = true;
      } else {
        personGroup.style.display = 'none';
        personInput.required = false;
        personInput.value = '';
      }
    }

    typeSelect.addEventListener('change', updateFieldVisibility);

    // Save Entry Logic
    document.getElementById('trackerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving...";

      const date = document.getElementById('date').value;
      const type = typeSelect.value;
      const amount = parseFloat(document.getElementById('amount').value);
      const description = document.getElementById('description').value;
      let person_name = null;
      let customer_id = null;

      try {
        if (!supabaseClient) {
          throw new Error("Supabase Client Load Nahi Hua. app.js me Credentials Check Karein!");
        }

        if (type === 'debt' || type === 'debt_repayment') {
          person_name = personInput.value.trim();
          if (!person_name) throw new Error('Bande ka NAAM zaroor bharein!');
          customer_id = await getOrCreateCustomer(person_name);
        }

        const { error } = await supabaseClient
          .from('daily_records')
          .insert([{ date, type, customer_id, person_name, amount, description }]);

        if (error) throw error;

        alert('Entry successfully save ho gayi!');
        document.getElementById('amount').value = '';
        document.getElementById('description').value = '';
        personInput.value = '';
        updateFieldVisibility();
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Save Entry";
      }
    });

    // PDF Generator Logic
    async function generatePDF() {
      const monthVal = document.getElementById('reportMonth').value;
      if (!monthVal) return alert("Month select karein!");

      const [year, month] = monthVal.split('-');
      const startDate = `${year}-${month}-01`;
      const endDate = new Date(year, month, 0).toISOString().split('T')[0];

      try {
        const { data: records, error: recErr } = await supabaseClient
          .from('daily_records')
          .select('*')
          .gte('date', startDate)
          .lte('date', endDate);

        if (recErr) throw recErr;

        const { data: ledger, error: ledErr } = await supabaseClient
          .from('customer_ledger')
          .select('*');

        if (ledErr) throw ledErr;

        let totalSales = 0, totalPurchase = 0, totalExpense = 0;

        (records || []).forEach(item => {
          const amt = parseFloat(item.amount);
          if (item.type === 'sell') totalSales += amt;
          if (item.type === 'purchase') totalPurchase += amt;
          if (item.type === 'expense') totalExpense += amt;
        });

        document.getElementById('pdfMonthLabel').innerText = `Report Period: ${monthVal}`;
        document.getElementById('pdfSales').innerText = totalSales.toFixed(2);
        document.getElementById('pdfPurchase').innerText = totalPurchase.toFixed(2);
        document.getElementById('pdfExpense').innerText = totalExpense.toFixed(2);

        const debtTbody = document.getElementById('pdfDebtRows');
        debtTbody.innerHTML = '';

        (ledger || []).forEach(cust => {
          const given = parseFloat(cust.total_udhar_diya || 0);
          const received = parseFloat(cust.total_wapas_mila || 0);
          const remaining = parseFloat(cust.net_baaki_amount || 0);

          debtTbody.innerHTML += `
            <tr>
              <td>${cust.customer_name}</td>
              <td>₹ ${given.toFixed(2)}</td>
              <td>₹ ${received.toFixed(2)}</td>
              <td style="font-weight: bold; color: ${remaining > 0 ? '#dc2626' : '#16a34a'};">
                ₹ ${remaining.toFixed(2)}
              </td>
            </tr>
          `;
        });

        const element = document.getElementById('pdfContent');
        element.style.display = 'block';

        html2pdf().set({
          margin: 10,
          filename: `Financial_Report_${monthVal}.pdf`,
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }).from(element).save().then(() => {
          element.style.display = 'none';
        });

      } catch (err) {
        alert('Report fetch karne me error: ' + err.message);
      }
    }
  </script>
</body>
</html>
