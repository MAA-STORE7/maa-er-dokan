<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Daily Finance Tracker</title>
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 50px auto; padding: 20px; background-color: #f4f6f9; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, button { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #218838; }
    .toggle-link { color: #007bff; text-align: center; cursor: pointer; text-decoration: underline; margin-top: 15px; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="authTitle">Login to Account</h2>
    <form id="authForm">
      <div class="form-group">
        <label for="authEmail">Email Address:</label>
        <input type="email" id="authEmail" placeholder="aapkaemail@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="authPassword">Password:</label>
        <input type="password" id="authPassword" placeholder="Minimum 6 characters" required>
      </div>

      <button type="submit" id="authBtn">Login</button>
    </form>
    
    <span class="toggle-link" id="toggleAuth" onclick="toggleAuthMode()">New User? Create an account (Sign Up)</span>
  </div>

  <script src="app.js"></script>
  <script>
    // Agar user pehle se logged in hai toh direct tracker page par bhej do
    window.addEventListener('DOMContentLoaded', async () => {
      const session = await getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    });

    let isSignUpMode = false;

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      const title = document.getElementById('authTitle');
      const btn = document.getElementById('authBtn');
      const toggle = document.getElementById('toggleAuth');

      if (isSignUpMode) {
        title.innerText = "Create New Account";
        btn.innerText = "Sign Up";
        toggle.innerText = "Already have an account? Login";
      } else {
        title.innerText = "Login to Account";
        btn.innerText = "Login";
        toggle.innerText = "New User? Create an account (Sign Up)";
      }
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const btn = document.getElementById('authBtn');

      btn.disabled = true;
      btn.innerText = "Processing...";

      try {
        if (isSignUpMode) {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          alert('Account created! Logging in...');
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
        window.location.href = 'index.html';
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = isSignUpMode ? "Sign Up" : "Login";
      }
    });
  </script>
</body>
</html>
